<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Completed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .congrats-container {
            max-width: 600px;
            margin: 80px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .congrats-icon {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 20px;
        }
        .congrats-title {
            color: #28a745;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .congrats-message {
            margin-bottom: 30px;
            font-size: 18px;
            color: #555;
        }
        .home-button {
            background-color: #007bff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .home-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="congrats-container">
            <div class="congrats-icon">
                <i class="bi bi-check-circle-fill">✅</i>
            </div>
            <h1 class="congrats-title">Congratulations!</h1>
            <p class="congrats-message">
                Your exam has been successfully submitted. Thank you for completing the exam.
            </p>
        </div>
    </div>
</body>
</html>
